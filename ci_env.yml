# Create environment with conda running:
# conda env create -n ci --file ci_env.yml
# Change "create" to "update" when updating.
name: ci
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.12
  - numpy
  - matplotlib=3.9.2
  - toml
  - ipython
  - sphinx #API documentation
  - scipy
  - pytest
  - pip
  - pip:
      - spectral # for image cube read and write
      #- spectres # for resampling spectra
      - FreeSimpleGUI # PySimpleGUI went to propriatery, so we switched to open-source fork FreeSimpleGUI
      - pyinstaller
